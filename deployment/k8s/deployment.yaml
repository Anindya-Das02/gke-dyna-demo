apiVersion: apps/v1
kind: Deployment
metadata:
  name: gke-dyna-demo
  labels:
    app: gke-dyna-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gke-dyna-demo
  template:
    metadata:
      labels:
        app: gke-dyna-demo
    spec:
      containers:
        - name: gke-dyna-demo
          image: gke-dyna-demo-img:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20